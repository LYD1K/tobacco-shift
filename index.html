<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Табачный учёт — Смена</title>
    
    <!-- Firebase SDK -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    
    <style>
        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2a2a2a;
            --gold: #d4a853;
            --gold-light: #e8c97a;
            --gold-dark: #b8913a;
            --text-primary: #f5f0e6;
            --text-secondary: #c4b998;
            --text-muted: #8a8070;
            --green: #5cb85c;
            --blue: #5b9bd5;
            --orange: #e8a04c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 10px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(212, 168, 83, 0.05) 0%, transparent 50%),
                linear-gradient(180deg, #1a1a1a 0%, #0f0f0f 100%);
        }

        .app {
            max-width: 600px;
            width: 100%;
            background: var(--bg-secondary);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(212, 168, 83, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 95vh;
        }

        /* Шапка */
        .header {
            background: linear-gradient(180deg, #2a2a2a 0%, #222 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--gold-dark);
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 2px;
            background: var(--gold);
            box-shadow: 0 0 10px var(--gold);
        }

        .header .date {
            font-size: 14px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .header .date button {
            background: rgba(212, 168, 83, 0.15);
            border: 1px solid rgba(212, 168, 83, 0.3);
            color: var(--gold);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .header .date button:hover {
            background: rgba(212, 168, 83, 0.3);
            border-color: var(--gold);
        }

        /* Выбор кассира */
        .cashier-selector {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin: 10px 0;
        }

        .cashier-btn {
            padding: 8px 20px;
            border: 2px solid var(--gold-dark);
            background: transparent;
            color: var(--text-secondary);
            border-radius: 20px;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .cashier-btn.active {
            background: var(--gold-dark);
            color: white;
            border-color: var(--gold);
            box-shadow: 0 0 15px rgba(212, 168, 83, 0.3);
        }

        .total-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .total {
            font-size: 42px;
            font-weight: 800;
            color: var(--gold);
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(212, 168, 83, 0.3);
        }

        /* Блок зарплаты */
        .salary-block {
            background: rgba(212, 168, 83, 0.1);
            border: 1px solid var(--gold-dark);
            border-radius: 12px;
            padding: 15px;
            margin: 15px;
            text-align: center;
        }

        .salary-block .salary-label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .salary-block .salary-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--gold);
        }

        .salary-block .salary-details {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        /* Остаток наличных */
        .cash-remainder {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 10px;
            background: rgba(255,255,255,0.02);
            margin: 0 15px 10px;
            border-radius: 8px;
        }

        .cash-remainder label {
            font-size: 13px;
            color: var(--text-secondary);
        }

        .cash-remainder input {
            width: 120px;
            padding: 8px;
            background: #333;
            border: 1px solid #444;
            border-radius: 6px;
            color: var(--text-primary);
            font-size: 16px;
            text-align: center;
            outline: none;
        }

        .cash-remainder input:focus {
            border-color: var(--gold);
        }

        /* Итоги по типам */
        .summary {
            display: flex;
            justify-content: space-around;
            padding: 15px 10px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid #333;
            gap: 8px;
        }

        .summary-item {
            text-align: center;
            flex: 1;
            padding: 8px 5px;
            border-radius: 10px;
            background: rgba(255,255,255,0.02);
        }

        .summary-item .label {
            font-size: 12px;
            color: var(--text-secondary);
            margin-bottom: 6px;
        }

        .summary-item .value {
            font-size: 18px;
            font-weight: 700;
        }

        .summary-item.cash .value {
            color: var(--green);
        }
        .summary-item.card .value {
            color: var(--blue);
        }
        .summary-item.transfer .value {
            color: var(--orange);
        }

        /* Таблица операций */
        .operations {
            flex: 1;
            display: flex;
            gap: 1px;
            background: #222;
            min-height: 250px;
            max-height: 40vh;
            overflow: hidden;
        }

        .column {
            flex: 1;
            background: #2a2a2a;
            display: flex;
            flex-direction: column;
        }

        .column-header {
            padding: 10px 5px;
            text-align: center;
            font-weight: 600;
            font-size: 13px;
            background: #333;
            border-bottom: 1px solid #444;
            color: var(--text-secondary);
        }

        .column-operations {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .operation {
            padding: 8px 5px;
            margin-bottom: 4px;
            background: #333;
            border-radius: 6px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            border: 1px solid transparent;
        }

        .operation:hover {
            background: #3a3a3a;
            border-color: rgba(212, 168, 83, 0.2);
        }

        .operation .amount {
            font-size: 14px;
            font-weight: 600;
        }

        .operation .meta {
            font-size: 10px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .empty-state {
            color: #555;
            font-size: 11px;
            text-align: center;
            padding: 15px 0;
        }

        /* Кнопки ввода */
        .input-buttons {
            display: flex;
            gap: 8px;
            padding: 12px;
            background: #222;
            border-top: 1px solid #333;
        }

        .input-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
        }

        .input-btn:active {
            transform: scale(0.95);
        }

        .input-btn.cash {
            background: #4a8f4a;
        }
        .input-btn.card {
            background: #4a7ba8;
        }
        .input-btn.transfer {
            background: #b87a3a;
        }

        /* Кнопка завершения */
        .end-shift {
            margin: 12px;
            padding: 14px;
            background: linear-gradient(135deg, #8b4513, #a0522d);
            color: white;
            border: 2px solid var(--gold);
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .end-shift:hover {
            box-shadow: 0 0 20px rgba(212, 168, 83, 0.3);
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #2a2a2a;
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--gold-dark);
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-input {
            width: 100%;
            padding: 15px;
            font-size: 24px;
            text-align: center;
            border: 2px solid #444;
            border-radius: 10px;
            margin-bottom: 20px;
            outline: none;
            background: #333;
            color: var(--text-primary);
        }

        .modal-input:focus {
            border-color: var(--gold);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }

        .modal-btn.confirm {
            background: var(--gold-dark);
            color: white;
        }

        .modal-btn.cancel {
            background: #555;
            color: white;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Шапка -->
        <div class="header">
            <div class="date">
                <button id="prevDay">←</button>
                <span id="currentDate"></span>
                <button id="nextDay">→</button>
            </div>
            
            <!-- Выбор кассира -->
            <div class="cashier-selector">
                <button class="cashier-btn active" data-cashier="Елизавета">Елизавета</button>
                <button class="cashier-btn" data-cashier="Соня">Соня</button>
            </div>
            
            <div class="total-label">Итого за смену</div>
            <div class="total" id="totalSum">0 ₽</div>
        </div>

        <!-- Блок зарплаты -->
        <div class="salary-block">
            <div class="salary-label">💰 Зарплата</div>
            <div class="salary-value" id="salaryValue">1 500 ₽</div>
            <div class="salary-details" id="salaryDetails">Оклад: 1 500 ₽ + 5% от продаж</div>
        </div>

        <!-- Остаток наличных -->
        <div class="cash-remainder">
            <label>Остаток наличных:</label>
            <input type="number" id="cashRemainder" placeholder="0" value="0">
        </div>

        <!-- Итоги по типам -->
        <div class="summary">
            <div class="summary-item cash">
                <div class="label">💵 Нал</div>
                <div class="value" id="cashTotal">0 ₽</div>
            </div>
            <div class="summary-item card">
                <div class="label">💳 Карта</div>
                <div class="value" id="cardTotal">0 ₽</div>
            </div>
            <div class="summary-item transfer">
                <div class="label">📱 Перевод</div>
                <div class="value" id="transferTotal">0 ₽</div>
            </div>
        </div>

        <!-- Таблица операций -->
        <div class="operations">
            <div class="column">
                <div class="column-header">💵 НАЛ</div>
                <div class="column-operations" id="cashOperations"></div>
            </div>
            <div class="column">
                <div class="column-header">💳 КАРТА</div>
                <div class="column-operations" id="cardOperations"></div>
            </div>
            <div class="column">
                <div class="column-header">📱 ПЕРЕВОД</div>
                <div class="column-operations" id="transferOperations"></div>
            </div>
        </div>

        <!-- Кнопки ввода -->
        <div class="input-buttons">
            <button class="input-btn cash" id="cashBtn">💵 НАЛ</button>
            <button class="input-btn card" id="cardBtn">💳 КАРТА</button>
            <button class="input-btn transfer" id="transferBtn">📱 ПЕРЕВОД</button>
        </div>

        <!-- Кнопка завершения -->
        <button class="end-shift" id="endShiftBtn">🔄 Завершить смену</button>
    </div>

    <!-- Модальное окно -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">Введите сумму</div>
            <input type="number" class="modal-input" id="modalInput" placeholder="0">
            <div class="modal-buttons">
                <button class="modal-btn cancel" id="cancelBtn">Отмена</button>
                <button class="modal-btn confirm" id="confirmBtn">OK</button>
            </div>
        </div>
    </div>

    <script>
        // Firebase конфигурация
        const firebaseConfig = {
            apiKey: "AIzaSyDqWKwiask8jbTCbyKmHwWCBwS8vbm2OL4",
            authDomain: "tobacco-shift.firebaseapp.com",
            projectId: "tobacco-shift",
            storageBucket: "tobacco-shift.firebasestorage.app",
            messagingSenderId: "498827469918",
            appId: "1:498827469918:web:ec4ec50dde52fef1dd80cf"
        };

        // Инициализация Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        // Telegram конфигурация
        const TELEGRAM_BOT_TOKEN = '8822646062:AAHoB6CC-JdEa7-ZrKynoPJjdBVAMdnVsZ8';
        const TELEGRAM_CHAT_ID = '-1004480688357';

        // Данные
        let currentDate = new Date();
        let currentOperationType = null;
        let currentCashier = 'Елизавета';
        let currentShiftData = {
            cash: [],
            card: [],
            transfer: [],
            ended: false,
            endCash: null,
            startCash: 0
        };

        // Инициализация
        async function init() {
            updateDateDisplay();
            await loadShiftData();
            updateTotals();
            checkShiftStatus();
            setupEventListeners();
        }

        // Загрузка данных смены из Firebase
        async function loadShiftData() {
            const dateKey = getDateKey(currentDate);
            const docRef = db.collection('shifts').doc(dateKey);
            
            try {
                const doc = await docRef.get();
                if (doc.exists) {
                    currentShiftData = doc.data();
                } else {
                    // Очищаем данные
                    currentShiftData = {
                        cash: [],
                        card: [],
                        transfer: [],
                        ended: false,
                        endCash: null,
                        startCash: 0
                    };
                    
                    // Пробуем подтянуть остаток с прошлой смены
                    const prevDate = new Date(currentDate);
                    prevDate.setDate(prevDate.getDate() - 1);
                    const prevKey = getDateKey(prevDate);
                    const prevDoc = await db.collection('shifts').doc(prevKey).get();
                    
                    if (prevDoc.exists && prevDoc.data().endCash) {
                        currentShiftData.startCash = prevDoc.data().endCash;
                    }
                }
                renderOperations();
                updateCashRemainder();
            } catch (error) {
                console.error('Ошибка загрузки:', error);
            }
        }

        // Сохранение данных смены в Firebase
        async function saveShiftData() {
            const dateKey = getDateKey(currentDate);
            const docRef = db.collection('shifts').doc(dateKey);
            
            try {
                await docRef.set(currentShiftData);
            } catch (error) {
                console.error('Ошибка сохранения:', error);
                alert('Ошибка сохранения данных!');
            }
        }

        // Получение ключа даты
        function getDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return year + '-' + month + '-' + day;
        }

        // Обновление отображения даты
        function updateDateDisplay() {
            const options = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
            document.getElementById('currentDate').textContent = currentDate.toLocaleDateString('ru-RU', options);
        }

        // Переключение даты
        async function changeDay(delta) {
            currentDate.setDate(currentDate.getDate() + delta);
            updateDateDisplay();
            
            // Очищаем текущие данные
            currentShiftData = {
                cash: [],
                card: [],
                transfer: [],
                ended: false,
                endCash: null,
                startCash: 0
            };
            
            await loadShiftData();
            updateTotals();
            checkShiftStatus();
        }

        // Настройка обработчиков событий
        function setupEventListeners() {
            document.getElementById('prevDay').addEventListener('click', () => changeDay(-1));
            document.getElementById('nextDay').addEventListener('click', () => changeDay(1));
            
            document.querySelectorAll('.cashier-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.cashier-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    currentCashier = this.dataset.cashier;
                });
            });
            
            document.getElementById('cashBtn').addEventListener('click', () => openModal('cash'));
            document.getElementById('cardBtn').addEventListener('click', () => openModal('card'));
            document.getElementById('transferBtn').addEventListener('click', () => openModal('transfer'));
            
            document.getElementById('cancelBtn').addEventListener('click', closeModal);
            document.getElementById('confirmBtn').addEventListener('click', confirmOperation);
            
            document.getElementById('endShiftBtn').addEventListener('click', endShift);
            
            document.getElementById('cashRemainder').addEventListener('change', function() {
                currentShiftData.startCash = parseFloat(this.value) || 0;
                saveShiftData();
            });
        }

        // Открытие модального окна
        function openModal(type) {
            currentOperationType = type;
            const titles = {
                cash: '💵 Введите сумму наличными',
                card: '💳 Введите сумму по карте',
                transfer: '📱 Введите сумму перевода'
            };
            document.getElementById('modalTitle').textContent = titles[type];
            document.getElementById('modalInput').value = '';
            document.getElementById('modal').classList.add('active');
            setTimeout(() => document.getElementById('modalInput').focus(), 100);
        }

        // Закрытие модального окна
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            currentOperationType = null;
        }

        // Подтверждение операции
        async function confirmOperation() {
            const amount = parseFloat(document.getElementById('modalInput').value);
            
            if (!amount || amount <= 0 || isNaN(amount)) {
                alert('Введите корректную сумму');
                return;
            }

            if (!currentShiftData[currentOperationType]) {
                currentShiftData[currentOperationType] = [];
            }

            const operation = {
                amount: amount,
                time: new Date().toTimeString().slice(0, 5),
                cashier: currentCashier
            };

            currentShiftData[currentOperationType].push(operation);
            await saveShiftData();

            closeModal();
            renderOperations();
            updateTotals();
        }

        // Отображение операций
        function renderOperations() {
            renderColumn('cashOperations', currentShiftData.cash || []);
            renderColumn('cardOperations', currentShiftData.card || []);
            renderColumn('transferOperations', currentShiftData.transfer || []);
        }

        // Отображение одной колонки
        function renderColumn(elementId, operations) {
            const element = document.getElementById(elementId);
            element.innerHTML = '';

            if (operations.length === 0) {
                element.innerHTML = '<div class="empty-state">Пусто</div>';
                return;
            }

            operations.forEach((op, index) => {
                const opElement = document.createElement('div');
                opElement.className = 'operation';

                let amount = typeof op === 'number' ? op : op.amount;
                let time = typeof op === 'number' ? '' : op.time;
                let cashier = typeof op === 'number' ? '' : (op.cashier || '');

                opElement.innerHTML = `
                    <div class="amount">${amount} ₽</div>
                    ${cashier || time ? `<div class="meta">${cashier}${cashier && time ? ' · ' : ''}${time}</div>` : ''}
                `;

                opElement.addEventListener('click', async function() {
                    if (!currentShiftData.ended) {
                        if (confirm('Удалить операцию на ' + amount + ' ₽?')) {
                            operations.splice(index, 1);
                            await saveShiftData();
                            renderOperations();
                            updateTotals();
                        }
                    }
                });

                element.appendChild(opElement);
            });
        }

        // Обновление итогов
        function updateTotals() {
            const cashSum = (currentShiftData.cash || []).reduce((a, b) => a + (typeof b === 'number' ? b : b.amount || 0), 0);
            const cardSum = (currentShiftData.card || []).reduce((a, b) => a + (typeof b === 'number' ? b : b.amount || 0), 0);
            const transferSum = (currentShiftData.transfer || []).reduce((a, b) => a + (typeof b === 'number' ? b : b.amount || 0), 0);
            const totalSum = cashSum + cardSum + transferSum;

            document.getElementById('cashTotal').textContent = cashSum + ' ₽';
            document.getElementById('cardTotal').textContent = cardSum + ' ₽';
            document.getElementById('transferTotal').textContent = transferSum + ' ₽';
            document.getElementById('totalSum').textContent = totalSum + ' ₽';

            // Обновляем зарплату
            const salary = 1500 + (totalSum * 0.05);
            document.getElementById('salaryValue').textContent = salary.toFixed(0) + ' ₽';
            document.getElementById('salaryDetails').textContent = `Оклад: 1 500 ₽ + ${(totalSum * 0.05).toFixed(0)} ₽ (5%)`;
        }

        // Обновление остатка наличных
        function updateCashRemainder() {
            document.getElementById('cashRemainder').value = currentShiftData.startCash || 0;
        }

        // Проверка статуса смены
        function checkShiftStatus() {
            const today = new Date();
            const todayKey = getDateKey(today);
            const currentKey = getDateKey(currentDate);
            const isPastDay = currentKey < todayKey;
            
            if (currentShiftData.ended || isPastDay) {
                document.getElementById('cashBtn').style.display = 'none';
                document.getElementById('cardBtn').style.display = 'none';
                document.getElementById('transferBtn').style.display = 'none';
                document.getElementById('endShiftBtn').textContent = isPastDay ? '📅 Прошлый день' : '✅ Смена завершена';
                document.getElementById('endShiftBtn').style.opacity = '0.5';
                document.getElementById('endShiftBtn').style.pointerEvents = 'none';
            } else {
                document.getElementById('cashBtn').style.display = 'block';
                document.getElementById('cardBtn').style.display = 'block';
                document.getElementById('transferBtn').style.display = 'block';
                document.getElementById('endShiftBtn').textContent = '🔄 Завершить смену';
                document.getElementById('endShiftBtn').style.opacity = '1';
                document.getElementById('endShiftBtn').style.pointerEvents = 'auto';
            }
        }

        // Отправка в Telegram
        async function sendToTelegram(message) {
            const url = `/api/telegram/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

            try {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });

                const data = await response.json();

                if (data.ok) {
                    return true;
                } else {
                    throw new Error(data.description || 'Ошибка Telegram API');
                }
            } catch (error) {
                console.error('Ошибка отправки:', error);
                throw error;
            }
        }

        // Завершение смены
        async function endShift() {
            if (currentShiftData.ended) {
                alert('Смена уже завершена!');
                return;
            }
            
            // Проверяем, не прошлая ли это дата
            const today = new Date();
            const todayKey = getDateKey(today);
            const currentKey = getDateKey(currentDate);
            
            if (currentKey < todayKey) {
                alert('Нельзя завершить смену за прошлый день!');
                return;
            }
            
            const endCash = prompt('Фактический остаток наличных в кассе:', currentShiftData.startCash || '0');
            if (endCash === null) {
                return;
            }

            currentShiftData.endCash = parseFloat(endCash) || 0;
            currentShiftData.ended = true;
            currentShiftData.endedAt = new Date().toTimeString().slice(0, 5);

            const cashSum = (currentShiftData.cash || []).reduce((a, b) => a + (typeof b === 'number' ? b : b.amount || 0), 0);
            const cardSum = (currentShiftData.card || []).reduce((a, b) => a + (typeof b === 'number' ? b : b.amount || 0), 0);
            const transferSum = (currentShiftData.transfer || []).reduce((a, b) => a + (typeof b === 'number' ? b : b.amount || 0), 0);
            const totalSales = cashSum + cardSum + transferSum;
            const salary = 1500 + (totalSales * 0.05);

            // Считаем продажи по кассирам
            const cashierStats = {};
            const allOperations = [
                ...(currentShiftData.cash || []),
                ...(currentShiftData.card || []),
                ...(currentShiftData.transfer || [])
            ];

            allOperations.forEach(op => {
                if (typeof op === 'number') return;
                const cashier = op.cashier || 'Неизвестно';
                const amount = op.amount || 0;
                if (!cashierStats[cashier]) {
                    cashierStats[cashier] = { amount: 0, count: 0 };
                }
                cashierStats[cashier].amount += amount;
                cashierStats[cashier].count++;
            });

            await saveShiftData();

            // Формируем сообщение
            let message = `📊 <b>Смена ${getDateKey(currentDate)}</b>\n`;
            message += `═══════════════\n`;
            
            const uniqueCashiers = Object.keys(cashierStats);
            
            if (uniqueCashiers.length === 0) {
                message += `💰 <b>ЗАРПЛАТА: ${salary.toFixed(0)} ₽</b>\n`;
            } else if (uniqueCashiers.length === 1) {
                message += `💰 <b>ЗАРПЛАТА: ${salary.toFixed(0)} ₽</b>\n`;
                message += `═══════════════\n`;
                message += `👤 ${uniqueCashiers[0]}: ${cashierStats[uniqueCashiers[0]].amount} ₽ (${cashierStats[uniqueCashiers[0]].count} оп.)\n`;
            } else {
                message += `💰 <b>ОБЩАЯ ЗАРПЛАТА: ${salary.toFixed(0)} ₽</b>\n`;
                message += `═══════════════\n`;
                uniqueCashiers.forEach(cashier => {
                    const cashierSalary = (cashierStats[cashier].amount / totalSales) * salary;
                    message += `👤 ${cashier}:\n`;
                    message += `   Продажи: ${cashierStats[cashier].amount} ₽ (${cashierStats[cashier].count} оп.)\n`;
                    message += `   Зарплата: ~${cashierSalary.toFixed(0)} ₽\n\n`;
                });
            }
            
            message += `═══════════════\n`;
            message += `Остаток на начало: ${currentShiftData.startCash} ₽\n\n`;
            message += `💵 Нал: +${cashSum} ₽\n`;
            message += `💳 Карта: +${cardSum} ₽\n`;
            message += `📱 Перевод: +${transferSum} ₽\n`;
            message += `─────────────────\n`;
            message += `Сумма продаж: ${totalSales} ₽\n`;
            message += `─────────────────\n`;
            message += `Остаток на конец: ${currentShiftData.endCash} ₽\n`;
            message += `Завершена в: ${currentShiftData.endedAt}`;

            try {
                await sendToTelegram(message);
                alert('✅ Смена завершена!\n\nЗарплата: ' + salary.toFixed(0) + ' ₽\nОстаток наличных: ' + currentShiftData.endCash + ' ₽\n\nИтоги отправлены в Telegram!');
            } catch (error) {
                alert('⚠️ Смена завершена, но не удалось отправить в Telegram.\n\nЗарплата: ' + salary.toFixed(0) + ' ₽\nОстаток наличных: ' + currentShiftData.endCash + ' ₽');
            }

            checkShiftStatus();
        }

        // Запуск
        init();
    </script>
</body>
</html>
