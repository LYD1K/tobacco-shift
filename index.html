<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Табачный учёт — Смена</title>
    <style>
        :root {
            --bg-primary: #1a1a1a;
            --bg-secondary: #2a2a2a;
            --bg-card: #333333;
            --gold: #d4a853;
            --gold-light: #e8c97a;
            --gold-dark: #b8913a;
            --text-primary: #f5f0e6;
            --text-secondary: #c4b998;
            --text-muted: #8a8070;
            --green: #5cb85c;
            --blue: #5b9bd5;
            --orange: #e8a04c;
            --red: #d9534f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 10px;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(212, 168, 83, 0.05) 0%, transparent 50%),
                linear-gradient(180deg, #1a1a1a 0%, #0f0f0f 100%);
        }

        .app {
            max-width: 600px;
            width: 100%;
            background: var(--bg-secondary);
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.5), 0 0 0 1px rgba(212, 168, 83, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            min-height: 95vh;
            position: relative;
        }

        /* Шапка */
        .header {
            background: linear-gradient(180deg, #2a2a2a 0%, #222 100%);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--gold-dark);
            position: relative;
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 50%;
            transform: translateX(-50%);
            width: 100px;
            height: 2px;
            background: var(--gold);
            box-shadow: 0 0 10px var(--gold);
        }

        .header .date {
            font-size: 14px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 10px;
        }

        .header .date button {
            background: rgba(212, 168, 83, 0.15);
            border: 1px solid rgba(212, 168, 83, 0.3);
            color: var(--gold);
            width: 36px;
            height: 36px;
            border-radius: 50%;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .header .date button:hover {
            background: rgba(212, 168, 83, 0.3);
            border-color: var(--gold);
        }

        .header .date button:active {
            transform: scale(0.9);
        }

        .total-label {
            font-size: 11px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .total {
            font-size: 42px;
            font-weight: 800;
            color: var(--gold);
            letter-spacing: 1px;
            text-shadow: 0 0 20px rgba(212, 168, 83, 0.3);
        }

        /* Итоги по типам */
        .summary {
            display: flex;
            justify-content: space-around;
            padding: 20px 10px;
            background: rgba(0,0,0,0.3);
            border-bottom: 1px solid #333;
            gap: 10px;
        }

        .summary-item {
            text-align: center;
            flex: 1;
            padding: 10px 5px;
            border-radius: 12px;
            background: rgba(255,255,255,0.02);
            transition: all 0.3s;
        }

        .summary-item:hover {
            background: rgba(212, 168, 83, 0.05);
        }

        .summary-item .label {
            font-size: 13px;
            color: var(--text-secondary);
            margin-bottom: 8px;
        }

        .summary-item .value {
            font-size: 22px;
            font-weight: 700;
        }

        .summary-item.cash .value {
            color: var(--green);
        }
        .summary-item.card .value {
            color: var(--blue);
        }
        .summary-item.transfer .value {
            color: var(--orange);
        }

        /* Таблица с операциями */
        .operations {
            flex: 1;
            display: flex;
            gap: 1px;
            background: #222;
            min-height: 300px;
            max-height: 45vh;
            overflow: hidden;
        }

        .column {
            flex: 1;
            background: #2a2a2a;
            display: flex;
            flex-direction: column;
        }

        .column-header {
            padding: 12px 5px;
            text-align: center;
            font-weight: 600;
            font-size: 14px;
            background: #333;
            border-bottom: 1px solid #444;
            position: sticky;
            top: 0;
            color: var(--text-secondary);
        }

        .column-operations {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
        }

        .operation {
            padding: 10px 5px;
            margin-bottom: 6px;
            background: #333;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            border: 1px solid transparent;
        }

        .operation:hover {
            background: #3a3a3a;
            border-color: rgba(212, 168, 83, 0.2);
        }

        .operation:active {
            transform: scale(0.95);
        }

        .operation .amount {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }

        .operation .time {
            font-size: 11px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .empty-state {
            color: #555;
            font-size: 12px;
            text-align: center;
            padding: 20px 0;
        }

        /* Кнопки ввода */
        .input-buttons {
            display: flex;
            gap: 10px;
            padding: 15px;
            background: #222;
            border-top: 1px solid #333;
        }

        .input-btn {
            flex: 1;
            padding: 15px;
            border: none;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .input-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
            transition: left 0.5s;
        }

        .input-btn:hover::before {
            left: 100%;
        }

        .input-btn:active {
            transform: scale(0.95);
        }

        .input-btn.cash {
            background: #4a8f4a;
        }
        .input-btn.cash:hover {
            background: #5cb85c;
        }

        .input-btn.card {
            background: #4a7ba8;
        }
        .input-btn.card:hover {
            background: #5b9bd5;
        }

        .input-btn.transfer {
            background: #b87a3a;
        }
        .input-btn.transfer:hover {
            background: #e8a04c;
        }

        /* Кнопка завершения смены */
        .end-shift {
            margin: 15px;
            padding: 15px;
            background: linear-gradient(135deg, #8b4513, #a0522d);
            color: white;
            border: 2px solid var(--gold);
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .end-shift:hover {
            background: linear-gradient(135deg, #a0522d, #b8913a);
            box-shadow: 0 0 20px rgba(212, 168, 83, 0.3);
        }

        .end-shift:active {
            transform: scale(0.95);
        }

        /* Модальное окно */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(5px);
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #2a2a2a;
            border-radius: 20px;
            padding: 25px;
            width: 90%;
            max-width: 400px;
            border: 1px solid var(--gold-dark);
            box-shadow: 0 0 40px rgba(0,0,0,0.8), 0 0 0 1px rgba(212, 168, 83, 0.2);
            animation: modalIn 0.3s ease;
        }

        @keyframes modalIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .modal-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
            text-align: center;
            color: var(--text-primary);
        }

        .modal-input {
            width: 100%;
            padding: 15px;
            font-size: 24px;
            text-align: center;
            border: 2px solid #444;
            border-radius: 10px;
            margin-bottom: 20px;
            outline: none;
            background: #333;
            color: var(--text-primary);
            transition: all 0.3s;
        }

        .modal-input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 10px rgba(212, 168, 83, 0.3);
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
        }

        .modal-btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .modal-btn.confirm {
            background: var(--gold-dark);
            color: white;
        }

        .modal-btn.confirm:hover {
            background: var(--gold);
        }

        .modal-btn.cancel {
            background: #555;
            color: white;
        }

        .modal-btn.cancel:hover {
            background: #666;
        }
    </style>
</head>
<body>
    <div class="app">
        <!-- Шапка -->
        <div class="header">
            <div class="date">
                <button id="prevDay" type="button">←</button>
                <span id="currentDate"></span>
                <button id="nextDay" type="button">→</button>
            </div>
            <div class="total-label">Итого за смену</div>
            <div class="total" id="totalSum">0 ₽</div>
        </div>

        <!-- Итоги по типам -->
        <div class="summary">
            <div class="summary-item cash">
                <div class="label">💵 Нал</div>
                <div class="value" id="cashTotal">0 ₽</div>
            </div>
            <div class="summary-item card">
                <div class="label">💳 Карта</div>
                <div class="value" id="cardTotal">0 ₽</div>
            </div>
            <div class="summary-item transfer">
                <div class="label">📱 Перевод</div>
                <div class="value" id="transferTotal">0 ₽</div>
            </div>
        </div>

        <!-- Таблица операций -->
        <div class="operations">
            <div class="column">
                <div class="column-header">💵 НАЛ</div>
                <div class="column-operations" id="cashOperations"></div>
            </div>
            <div class="column">
                <div class="column-header">💳 КАРТА</div>
                <div class="column-operations" id="cardOperations"></div>
            </div>
            <div class="column">
                <div class="column-header">📱 ПЕРЕВОД</div>
                <div class="column-operations" id="transferOperations"></div>
            </div>
        </div>

        <!-- Кнопки ввода -->
        <div class="input-buttons">
            <button class="input-btn cash" id="cashBtn" type="button">💵 НАЛ</button>
            <button class="input-btn card" id="cardBtn" type="button">💳 КАРТА</button>
            <button class="input-btn transfer" id="transferBtn" type="button">📱 ПЕРЕВОД</button>
        </div>

        <!-- Кнопка завершения смены -->
        <button class="end-shift" id="endShiftBtn" type="button">🔄 Завершить смену</button>
    </div>

    <!-- Модальное окно для ввода суммы -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-title" id="modalTitle">Введите сумму</div>
            <input type="number" class="modal-input" id="modalInput" placeholder="0" autofocus>
            <div class="modal-buttons">
                <button class="modal-btn cancel" id="cancelBtn" type="button">Отмена</button>
                <button class="modal-btn confirm" id="confirmBtn" type="button">OK</button>
            </div>
        </div>
    </div>

    <script>
        // Конфигурация Telegram
        const TELEGRAM_BOT_TOKEN = '8822646062:AAHoB6CC-JdEa7-ZrKynoPJjdBVAMdnVsZ8';
        const TELEGRAM_CHAT_ID = '-5587093103';
        
        // Данные
        let shifts = {};
        let currentDate = new Date();
        let currentOperationType = null;
        let currentCashier = null;

        // Инициализация
        function init() {
            loadShifts();
            updateDateDisplay();
            renderOperations();
            updateTotals();
            checkShiftStatus();
            
            // Привязываем обработчики событий
            document.getElementById('prevDay').addEventListener('click', function() {
                changeDay(-1);
            });
            
            document.getElementById('nextDay').addEventListener('click', function() {
                changeDay(1);
            });
            
            document.getElementById('cashBtn').addEventListener('click', function() {
                openModal('cash');
            });
            
            document.getElementById('cardBtn').addEventListener('click', function() {
                openModal('card');
            });
            
            document.getElementById('transferBtn').addEventListener('click', function() {
                openModal('transfer');
            });
            
            document.getElementById('endShiftBtn').addEventListener('click', function() {
                endShift();
            });
            
            document.getElementById('cancelBtn').addEventListener('click', function() {
                closeModal();
            });
            
            document.getElementById('confirmBtn').addEventListener('click', function() {
                confirmOperation();
            });
            
            // Обработчик Enter в модальном окне
            document.getElementById('modalInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') {
                    confirmOperation();
                }
            });
            
            // Закрытие модального окна при клике вне его
            document.getElementById('modal').addEventListener('click', function(e) {
                if (e.target === this) {
                    closeModal();
                }
            });
        }

        // Загрузка данных из localStorage
        function loadShifts() {
            const saved = localStorage.getItem('shifts');
            if (saved) {
                try {
                    shifts = JSON.parse(saved);
                } catch (e) {
                    shifts = {};
                }
            }
        }

        // Сохранение данных
        function saveShifts() {
            localStorage.setItem('shifts', JSON.stringify(shifts));
        }

        // Получение ключа для текущей даты
        function getDateKey(date) {
            const year = date.getFullYear();
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const day = String(date.getDate()).padStart(2, '0');
            return year + '-' + month + '-' + day;
        }

        // Получение данных за текущую смену
        function getCurrentShift() {
            const key = getDateKey(currentDate);
            if (!shifts[key]) {
                shifts[key] = {
                    cash: [],
                    card: [],
                    transfer: [],
                    cashier: null,
                    startCash: 0,
                    endCash: null,
                    incassation: 0,
                    salary: 0,
                    ended: false
                };
            }
            return shifts[key];
        }

        // Проверка статуса смены
        function checkShiftStatus() {
            const shift = getCurrentShift();
            
            if (shift.ended) {
                document.getElementById('cashBtn').style.display = 'none';
                document.getElementById('cardBtn').style.display = 'none';
                document.getElementById('transferBtn').style.display = 'none';
                document.getElementById('endShiftBtn').textContent = '✅ Смена завершена';
                document.getElementById('endShiftBtn').style.opacity = '0.5';
                document.getElementById('endShiftBtn').style.pointerEvents = 'none';
            } else {
                document.getElementById('cashBtn').style.display = 'block';
                document.getElementById('cardBtn').style.display = 'block';
                document.getElementById('transferBtn').style.display = 'block';
                document.getElementById('endShiftBtn').textContent = '🔄 Завершить смену';
                document.getElementById('endShiftBtn').style.opacity = '1';
                document.getElementById('endShiftBtn').style.pointerEvents = 'auto';
            }
        }

        // Обновление отображения даты
        function updateDateDisplay() {
            const options = { weekday: 'short', day: 'numeric', month: 'short', year: 'numeric' };
            document.getElementById('currentDate').textContent = currentDate.toLocaleDateString('ru-RU', options);
        }

        // Переключение даты
        function changeDay(delta) {
            currentDate.setDate(currentDate.getDate() + delta);
            updateDateDisplay();
            renderOperations();
            updateTotals();
            checkShiftStatus();
        }

        // Открытие модального окна
        function openModal(type) {
            currentOperationType = type;
            const titles = {
                cash: '💵 Введите сумму наличными',
                card: '💳 Введите сумму по карте',
                transfer: '📱 Введите сумму перевода'
            };
            document.getElementById('modalTitle').textContent = titles[type];
            document.getElementById('modalInput').value = '';
            document.getElementById('modal').classList.add('active');
            setTimeout(() => {
                document.getElementById('modalInput').focus();
            }, 100);
        }

        // Закрытие модального окна
        function closeModal() {
            document.getElementById('modal').classList.remove('active');
            currentOperationType = null;
        }

        // Подтверждение операции
        function confirmOperation() {
            const input = document.getElementById('modalInput');
            const amount = parseFloat(input.value);
            
            if (!amount || amount <= 0 || isNaN(amount)) {
                alert('Введите корректную сумму');
                return;
            }

            const shift = getCurrentShift();
            if (!shift[currentOperationType]) {
                shift[currentOperationType] = [];
            }
            
            const operation = {
                amount: amount,
                time: new Date().toTimeString().slice(0, 5)
            };
            
            shift[currentOperationType].push(operation);
            saveShifts();
            
            closeModal();
            renderOperations();
            updateTotals();
        }

        // Отображение операций
        function renderOperations() {
            const shift = getCurrentShift();
            
            renderColumn('cashOperations', shift.cash || [], 'cash');
            renderColumn('cardOperations', shift.card || [], 'card');
            renderColumn('transferOperations', shift.transfer || [], 'transfer');
        }

        // Отображение одной колонки
        function renderColumn(elementId, operations, type) {
            const element = document.getElementById(elementId);
            element.innerHTML = '';
            
            if (operations.length === 0) {
                element.innerHTML = '<div class="empty-state">Пусто</div>';
                return;
            }
            
            operations.forEach((op, index) => {
                const opElement = document.createElement('div');
                opElement.className = 'operation';
                
                // Проверяем формат данных
                let amount = op.amount;
                let time = op.time;
                
                if (typeof op === 'number') {
                    amount = op;
                    time = '';
                }
                
                opElement.innerHTML = `
                    <div class="amount">${amount} ₽</div>
                    ${time ? `<div class="time">${time}</div>` : ''}
                `;
                
                opElement.addEventListener('click', function() {
                    if (!getCurrentShift().ended) {
                        if (confirm('Удалить операцию на ' + amount + ' ₽?')) {
                            operations.splice(index, 1);
                            saveShifts();
                            renderOperations();
                            updateTotals();
                        }
                    }
                });
                element.appendChild(opElement);
            });
        }

        // Обновление итогов
        function updateTotals() {
            const shift = getCurrentShift();
            
            const cashSum = (shift.cash || []).reduce((a, b) => a + (typeof b === 'number' ? b : b.amount || 0), 0);
            const cardSum = (shift.card || []).reduce((a, b) => a + (typeof b === 'number' ? b : b.amount || 0), 0);
            const transferSum = (shift.transfer || []).reduce((a, b) => a + (typeof b === 'number' ? b : b.amount || 0), 0);
            const totalSum = cashSum + cardSum + transferSum;
            
            document.getElementById('cashTotal').textContent = cashSum + ' ₽';
            document.getElementById('cardTotal').textContent = cardSum + ' ₽';
            document.getElementById('transferTotal').textContent = transferSum + ' ₽';
            document.getElementById('totalSum').textContent = totalSum + ' ₽';
        }

        // Отправка в Telegram через прокси
        async function sendToTelegram(message) {
            const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;
            
            try {
                // Пробуем через прямой запрос
                const response = await fetch(url, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        chat_id: TELEGRAM_CHAT_ID,
                        text: message,
                        parse_mode: 'HTML'
                    })
                });
                
                const data = await response.json();
                
                if (data.ok) {
                    return true;
                } else {
                    throw new Error(data.description || 'Ошибка Telegram API');
                }
            } catch (error) {
                console.error('Ошибка отправки:', error);
                
                // Пробуем через прокси
                try {
                    const proxyUrl = 'https://api.allorigins.win/raw?url=' + encodeURIComponent(
                        `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage?chat_id=${TELEGRAM_CHAT_ID}&text=${encodeURIComponent(message)}&parse_mode=HTML`
                    );
                    
                    const proxyResponse = await fetch(proxyUrl);
                    const proxyData = await proxyResponse.json();
                    
                    if (proxyData.ok) {
                        return true;
                    } else {
                        throw new Error(proxyData.description || 'Ошибка через прокси');
                    }
                } catch (proxyError) {
                    console.error('Ошибка через прокси:', proxyError);
                    throw proxyError;
                }
            }
        }

        // Завершение смены
        async function endShift() {
            const shift = getCurrentShift();
            
            if (shift.ended) {
                alert('Смена уже завершена!');
                return;
            }
            
            // Спрашиваем кассира
            if (!currentCashier) {
                currentCashier = prompt('Введите имя кассира:', 'Елизавета');
                if (!currentCashier) {
                    return;
                }
            }
            
            // Спрашиваем остаток наличных в начале смены
            const startCash = prompt('Остаток наличных на начало смены:', '0');
            if (startCash === null) {
                return;
            }
            shift.startCash = parseFloat(startCash) || 0;
            shift.cashier = currentCashier;
            
            // Считаем сумму продаж
            const cashSum = (shift.cash || []).reduce((a, b) => a + (typeof b === 'number' ? b : b.amount || 0), 0);
            const cardSum = (shift.card || []).reduce((a, b) => a + (typeof b === 'number' ? b : b.amount || 0), 0);
            const transferSum = (shift.transfer || []).reduce((a, b) => a + (typeof b === 'number' ? b : b.amount || 0), 0);
            const totalSales = cashSum + cardSum + transferSum;
            
            // Считаем зарплату
            const salary = 1500 + (totalSales * 0.05);
            shift.salary = salary;
            
            // Спрашиваем инкассацию
            const incassation = prompt('Инкассация (если была):', '0');
            if (incassation === null) {
                return;
            }
            shift.incassation = parseFloat(incassation) || 0;
            
            // Спрашиваем фактический остаток наличных
            const endCash = prompt('Фактический остаток наличных в кассе:', '0');
            if (endCash === null) {
                return;
            }
            shift.endCash = parseFloat(endCash) || 0;
            
            // Завершаем смену
            shift.ended = true;
            shift.endedAt = new Date().toTimeString().slice(0, 5);
            saveShifts();
            
            // Формируем сообщение для Telegram
            const message = `📊 <b>Смена ${getDateKey(currentDate)}</b>\n` +
                `👤 Кассир: <b>${shift.cashier}</b>\n` +
                `═══════════════\n` +
                `💰 <b>ЗАРПЛАТА: ${salary.toFixed(0)} ₽</b>\n` +
                `═══════════════\n` +
                `Остаток на начало: ${shift.startCash} ₽\n\n` +
                `💵 Нал: +${cashSum} ₽\n` +
                `💳 Карта: +${cardSum} ₽\n` +
                `📱 Перевод: +${transferSum} ₽\n` +
                `─────────────────\n` +
                `Сумма продаж: ${totalSales} ₽\n\n` +
                `Инкассация: -${shift.incassation} ₽\n` +
                `─────────────────\n` +
                `Остаток наличных: ${shift.endCash} ₽\n` +
                `Завершена в: ${shift.endedAt}`;
            
            // Отправляем в Telegram
            try {
                await sendToTelegram(message);
                alert('✅ Смена завершена!\n\nЗарплата: ' + salary.toFixed(0) + ' ₽\nОстаток наличных: ' + shift.endCash + ' ₽\n\nИтоги отправлены в Telegram!');
            } catch (error) {
                alert('⚠️ Смена завершена, но не удалось отправить в Telegram.\n\nЗарплата: ' + salary.toFixed(0) + ' ₽\nОстаток наличных: ' + shift.endCash + ' ₽\n\nОшибка: ' + error.message);
            }
            
            // Обновляем интерфейс
            checkShiftStatus();
        }

        // Ждем загрузки DOM перед инициализацией
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', init);
        } else {
            init();
        }
    </script>
</body>
</html>
